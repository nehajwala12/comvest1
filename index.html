<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CreditSwan for Comvest Credit Partners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a presenter strip, then one Microsoft 365 window (suite bar, app rail, app view); CreditSwan brand lives only inside CreditSwan content. Single light look by design: it simulates Microsoft 365 in its default light theme. */
:root{
  color-scheme: light;
  /* Microsoft host chrome */
  --ms-font:'Segoe UI','Segoe UI Web (West European)',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif;
  --ms-bg:#f5f5f5; --ms-surface:#ffffff; --ms-surface2:#fafafa; --ms-hover:#f0f0f0; --ms-sel:#e8ebfa;
  --ms-border:#e0e0e0; --ms-border2:#d1d1d1; --ms-text:#242424; --ms-text2:#616161; --ms-text3:#8a8a8a;
  --teams:#5b5fc7; --teams-d:#444791; --teams-l:#e8ebfa;
  --outlook:#0f6cbd; --outlook-d:#0c5aa0; --outlook-l:#ebf3fc;
  --sp:#03787c; --sp-d:#025b5f; --sp-l:#e6f2f2;
  --xl:#107c41; --xl-d:#0b5a2f; --xl-l:#e9f5ee;
  --cop:#3f51b5; --cop-l:#eef0fb;
  --ms-red:#c4314b;
  /* CreditSwan brand */
  --cs-ink:#16211F; --cs-cream:#F4EFE6; --cs-gold:#A98543; --cs-teal:#1C4A45; --cs-pale:#E9C583; --cs-claret:#5C2B2E;
  --cs-line:rgba(22,33,31,.14); --cs-line2:rgba(22,33,31,.30); --cs-muted:rgba(22,33,31,.78); --cs-faint:rgba(22,33,31,.55);
  --cs-tint:#E5E3DB; --cs-teal-t:rgba(28,74,69,.10); --cs-claret-t:rgba(92,43,46,.09); --cs-pale-t:rgba(233,197,131,.35);
  --cs-serif:'Cormorant Garamond',Georgia,serif; --cs-sans:'Manrope',-apple-system,'Segoe UI',sans-serif; --cs-mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --shadow:0 1.6px 3.6px rgba(0,0,0,.13),0 .3px .9px rgba(0,0,0,.11);
  --shadow2:0 6.4px 14.4px rgba(0,0,0,.13),0 1.2px 3.6px rgba(0,0,0,.11);
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:#d9dcd8;color:var(--ms-text);font-family:var(--ms-font);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cs-gold);outline-offset:1px}
.mono{font-family:var(--cs-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

#demo{height:100%;display:grid;grid-template-rows:auto 1fr;padding:0 12px 12px;gap:0}
/* presenter strip (CreditSwan) */
.demobar{display:flex;align-items:center;gap:14px;padding:8px 4px;color:var(--cs-ink);font-family:var(--cs-mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;flex-wrap:wrap}
.demobar .lock{display:flex;align-items:center;gap:8px;font-family:var(--cs-serif);font-size:19px;letter-spacing:-.3px;text-transform:none;font-weight:600}
.demobar .tag{padding:3px 8px;border:1px solid var(--cs-line2);border-radius:3px;background:var(--cs-cream)}
.demobar .sp{flex:1}
.demobar button{font-family:var(--cs-mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;padding:6px 10px;border:1px solid var(--cs-ink);border-radius:3px;background:transparent}
.demobar button.pri{background:var(--cs-gold);border-color:var(--cs-gold);color:var(--cs-ink)}

/* the Microsoft window */
.win{min-height:0;display:grid;grid-template-rows:48px 1fr;background:var(--ms-bg);border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.08)}
.suite{display:flex;align-items:center;gap:12px;padding:0 12px 0 0;color:#fff;transition:background .35s}
.suite .waffle{width:48px;height:48px;display:grid;place-items:center}
.suite .appname{font-weight:600;font-size:16px;white-space:nowrap}
.suite .search{flex:1;max-width:520px;margin:0 auto;height:32px;border-radius:4px;background:rgba(255,255,255,.9);color:var(--ms-text2);display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px;min-width:0}
.suite .search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suite .right{display:flex;align-items:center;gap:14px;font-size:12px;white-space:nowrap}
.suite .clock{font-variant-numeric:tabular-nums;opacity:.92}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:#c7d8f1;color:#163a6b;flex:none}
.avatar.sm{width:28px;height:28px;font-size:11px}
.avatar.cs{background:var(--cs-ink);color:var(--cs-cream)}
.wbody{min-height:0;display:grid;grid-template-columns:68px 1fr}
.rail{background:#ebebeb;display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;border-right:1px solid var(--ms-border)}
.rail button{position:relative;width:64px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;color:var(--ms-text2);border-radius:6px}
.rail button:hover{background:#e0e0e0}
.rail button.on{color:var(--ms-text);font-weight:600}
.rail button.on::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--rc)}
.rail .ico{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.badge{position:absolute;top:6px;right:12px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ms-red);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;border:2px solid #ebebeb}
.badge.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#view{min-height:0;min-width:0;overflow:hidden;position:relative;background:var(--ms-surface)}
.fadein{animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- shared CreditSwan content ---------- */
.cs{font-family:var(--cs-sans);color:var(--cs-ink)}
.cs-panel{background:var(--cs-cream);border:1px solid var(--cs-line);border-radius:4px}
.cs-label{font-family:var(--cs-mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--cs-teal)}
.cs-faint{color:var(--cs-faint)}
.cs-h{font-family:var(--cs-serif);font-weight:600;letter-spacing:-.5px;line-height:1.1;text-wrap:balance;margin:0}
.swan{display:inline-block;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--cs-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 7px;border-radius:3px;border:1px solid var(--cs-line2);white-space:nowrap;color:var(--cs-ink)}
.chip.ok{border-color:rgba(28,74,69,.4);color:var(--cs-teal);background:var(--cs-teal-t)}
.chip.bad{border-color:rgba(92,43,46,.4);color:var(--cs-claret);background:var(--cs-claret-t)}
.chip.mid{border-color:rgba(169,133,67,.55);color:#6b521f;background:var(--cs-pale-t)}
.chip.syn{border-style:dashed;color:var(--cs-faint)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--cs-teal)} .dot.bad{background:var(--cs-claret)} .dot.mid{background:var(--cs-pale)} .dot.gold{background:var(--cs-gold)} .dot.idle{background:rgba(22,33,31,.3)}
table.cst{width:100%;border-collapse:collapse;font-size:13px}
table.cst th{font-family:var(--cs-mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--cs-teal);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--cs-line2)}
table.cst td.mono{white-space:nowrap}
table.cst td{padding:8px 10px;border-bottom:1px solid var(--cs-line);vertical-align:top}
table.cst .r{text-align:right;font-family:var(--cs-mono);font-variant-numeric:tabular-nums}
table.cst tr.hl td{background:var(--cs-pale-t)}
.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,30%{background:rgba(233,197,131,.85)}100%{background:transparent}}
.pulse{animation:pulse 1.6s ease-out 3}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(169,133,67,.6)}100%{box-shadow:0 0 0 12px rgba(169,133,67,0)}}

/* ---------- Teams ---------- */
.teams{height:100%;display:grid;grid-template-columns:280px 1fr;min-height:0}
.t-left{background:#f5f5f5;border-right:1px solid var(--ms-border);display:flex;flex-direction:column;min-height:0}
.t-left h3{margin:0;padding:14px 16px 8px;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.t-left .scroll{overflow:auto;padding:4px 8px 16px}
.t-team{display:flex;align-items:center;gap:10px;padding:8px 8px;font-weight:600;font-size:13.5px}
.t-team .ttile{width:28px;height:28px;border-radius:5px;background:var(--cs-teal);color:var(--cs-cream);display:grid;place-items:center;font-size:11px;font-weight:700}
.t-ch{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:7px 10px 7px 46px;border-radius:5px;font-size:13.5px;color:var(--ms-text)}
.t-ch:hover{background:#ebebeb}
.t-ch.on{background:#fff;box-shadow:var(--shadow);font-weight:600}
.t-ch.unread{font-weight:700}
.t-ch .n{background:var(--ms-red);color:#fff;border-radius:9px;font-size:10.5px;padding:1px 6px;font-weight:600}
.t-main{display:flex;flex-direction:column;min-height:0;min-width:0;background:#f5f5f5}
.t-head{background:#fff;border-bottom:1px solid var(--ms-border);padding:10px 20px 0}
.t-head .ttl{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700}
.t-tabs{display:flex;gap:18px;margin-top:6px;font-size:14px;overflow-x:auto}
.t-tabs button{padding:8px 0 10px;color:var(--ms-text2);border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.t-tabs button.on{color:var(--ms-text);font-weight:600;border-color:var(--teams)}
.t-posts{flex:1;overflow:auto;padding:18px 24px 18px;display:flex;flex-direction:column;gap:16px}
.post{background:#fff;border-radius:6px;box-shadow:var(--shadow);max-width:820px}
.post .ph{display:flex;align-items:center;gap:10px;padding:12px 16px 4px;font-size:12.5px;color:var(--ms-text2)}
.post .ph b{color:var(--ms-text);font-size:13.5px}
.post .pb{padding:4px 16px 14px 54px;line-height:1.5}
.post .replies{border-top:1px solid #f0f0f0;padding:10px 16px 12px 54px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.post .replies .rr{display:flex;gap:8px;align-items:flex-start}
.post .replyln{padding:8px 16px 10px 54px;border-top:1px solid #f0f0f0;color:var(--teams);font-size:13px}
.acard{border:1px solid var(--cs-line2);border-radius:4px;background:var(--cs-cream);overflow:hidden;margin-top:6px;font-family:var(--cs-sans);color:var(--cs-ink);max-width:620px}
.acard .top{height:4px;background:var(--cs-claret)}
.acard .top.watch{background:var(--cs-pale)}
.acard .in{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.acard .ttl{font-family:var(--cs-serif);font-size:21px;font-weight:600;line-height:1.15;letter-spacing:-.3px}
.acard p{margin:0;font-size:13.5px;line-height:1.5}
.acard .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--cs-line);border:1px solid var(--cs-line)}
.acard .facts>div{background:var(--cs-cream);padding:8px 10px}
.acard .facts .v{font-family:var(--cs-mono);font-size:17px;margin-top:3px}
.acard .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--cs-mono);font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;padding:7px 11px;border-radius:3px;border:1px solid var(--cs-ink);background:transparent;color:var(--cs-ink)}
.btn.pri{background:var(--cs-gold);border-color:var(--cs-gold)}
.btn:hover{background:var(--cs-tint)} .btn.pri:hover{background:#b8954f}
.compose{margin:0 24px 16px;background:#fff;border-radius:6px;box-shadow:var(--shadow);padding:10px 14px;color:var(--ms-text3);max-width:820px}
.newmsg{animation:slidein .55s ease-out}
@keyframes slidein{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- Outlook ---------- */
.ol{height:100%;display:grid;grid-template-columns:200px 340px 1fr;min-height:0}
.ol-cmd{grid-column:1/-1}
.ol-folders{background:#fafafa;border-right:1px solid var(--ms-border);padding:10px 6px;overflow:auto}
.ol-folders .grp{font-size:12px;font-weight:600;padding:10px 10px 4px;color:var(--ms-text2)}
.ol-folders button{width:100%;text-align:left;padding:7px 12px;border-radius:4px;display:flex;justify-content:space-between;font-size:13.5px}
.ol-folders button.on{background:var(--outlook-l);font-weight:600}
.ol-folders .c{color:var(--outlook);font-weight:600}
.ol-list{border-right:1px solid var(--ms-border);overflow:auto;background:#fff}
.ol-list .lh{display:flex;gap:16px;padding:12px 16px 8px;font-size:14px;border-bottom:1px solid var(--ms-border)}
.ol-list .lh b{border-bottom:2px solid var(--outlook);padding-bottom:6px}
.ol-item{display:block;width:100%;text-align:left;padding:10px 14px 10px 16px;border-bottom:1px solid #f0f0f0;position:relative}
.ol-item:hover{background:#f5f5f5}
.ol-item.on{background:var(--outlook-l)}
.ol-item.unread::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--outlook)}
.ol-item .r1{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.ol-item.unread .r1 span:first-child,.ol-item.unread .r2{font-weight:700}
.ol-item.unread .r2{color:var(--outlook)}
.ol-item .r2{font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.ol-item .r3{font-size:12.5px;color:var(--ms-text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol-item .tm{color:var(--ms-text2);font-size:12px;white-space:nowrap}
.ol-read{overflow:auto;background:#f5f5f5;padding:16px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ol-read h2{font-size:19px;font-weight:600;margin:4px 0 4px}
.mail{background:#fff;border-radius:6px;box-shadow:var(--shadow);padding:14px 18px;max-width:860px}
.mail .mh{display:flex;gap:12px;align-items:flex-start}
.mail .who{flex:1;min-width:0}
.mail .who b{font-size:14px}
.mail .who div{font-size:12.5px;color:var(--ms-text2);margin-top:1px}
.mail .tm{font-size:12px;color:var(--ms-text2);white-space:nowrap}
.mail .mb{margin:10px 0 0 44px;font-size:14px;line-height:1.55}
.mail .mb p{margin:0 0 10px}
.att{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0 44px}
.att span{display:flex;align-items:center;gap:8px;border:1px solid var(--ms-border);border-radius:4px;padding:6px 10px;font-size:12.5px;background:#fff}
.att i{width:18px;height:22px;border-radius:2px;display:inline-block;flex:none}
.mail.collapsed .mb,.mail.collapsed .att{display:none}
.mail.collapsed .who div.prev{display:block}
.prev{display:none}
.mail .acts{display:flex;gap:8px;margin:12px 0 0 44px}
.msbtn{border:1px solid var(--ms-border2);border-radius:4px;padding:5px 12px;font-size:13px;background:#fff;display:inline-flex;gap:6px;align-items:center}
.msbtn:hover{background:#f5f5f5}
.msbtn.pri{background:var(--outlook);border-color:var(--outlook);color:#fff}
.verified{border:1px solid var(--cs-line2);border-radius:4px;background:var(--cs-cream);margin:12px 0 4px;font-family:var(--cs-sans);color:var(--cs-ink);overflow:hidden}
.verified .vh{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--cs-line);flex-wrap:wrap}
.verified .vf{padding:8px 14px;border-top:1px solid var(--cs-line);font-family:var(--cs-mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--cs-muted)}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.25);display:grid;place-items:center;z-index:20;padding:16px}
.composer{width:min(640px,100%);background:#fff;border-radius:8px;box-shadow:var(--shadow2);overflow:hidden;animation:fadein .25s ease-out}
.composer .ch{background:var(--outlook);color:#fff;padding:10px 16px;font-weight:600;display:flex;justify-content:space-between}
.composer .row{display:flex;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid #eee;font-size:13.5px}
.composer .row label{width:56px;color:var(--ms-text2)}
.composer .pill{background:var(--outlook-l);border-radius:3px;padding:2px 8px;color:var(--outlook-d)}
.composer .bodytxt{padding:14px 16px;min-height:110px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.composer .cf{display:flex;justify-content:space-between;padding:10px 16px;border-top:1px solid #eee}
.caret::after{content:"";display:inline-block;width:1px;height:1.1em;background:currentColor;vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- SharePoint ---------- */
.spw{height:100%;display:flex;flex-direction:column;min-height:0;background:#faf9f8}
.sp-head{background:#fff;border-bottom:1px solid var(--ms-border);padding:14px 28px 0}
.sp-site{display:flex;align-items:center;gap:14px}
.sp-logo{width:44px;height:44px;border-radius:4px;background:var(--cs-ink);display:grid;place-items:center}
.sp-site .nm{font-size:20px;font-weight:600}
.sp-site .sub{font-size:12px;color:var(--ms-text2);margin-top:1px}
.sp-site .r{margin-left:auto;display:flex;gap:16px;font-size:13px;color:var(--ms-text2);align-items:center}
.sp-nav{display:flex;gap:4px;margin-top:8px;overflow-x:auto}
.sp-nav button{padding:10px 10px 11px;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap;color:var(--ms-text)}
.sp-nav button.on{border-color:var(--sp);font-weight:600}
.sp-nav button:hover{background:#f5f5f5}
.sp-cmd{display:flex;gap:4px;padding:6px 22px;background:#fff;border-bottom:1px solid var(--ms-border);font-size:13px;color:var(--ms-text);flex-wrap:wrap}
.sp-cmd span{padding:6px 10px;display:flex;gap:6px;align-items:center}
.sp-body{flex:1;overflow:auto;position:relative;padding:22px 28px 120px}
.sp-body.cs{background:#faf9f8}

/* command center */
.cc-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:22px 24px;border-top:4px solid var(--cs-gold)}
.cc-hero h1{font-size:34px}
.jobs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-top:1px solid var(--cs-line)}
.jobs>*{padding:12px 16px;border-right:1px solid var(--cs-line)}
.jobs>*:last-child{border-right:0}
.jobs .v{font-family:var(--cs-mono);font-size:22px;margin-top:4px}
.jobs .s{font-size:12px;color:var(--cs-muted);margin-top:2px}
.cc-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.25fr) minmax(0,1fr);gap:18px;margin-top:18px}
.cc-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--cs-cream);border:1px solid var(--cs-line);border-radius:4px;padding:16px 18px;min-width:0}
.card>.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.today li{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--cs-line);align-items:start;font-size:13px;line-height:1.45}
.today ul{margin:0;padding:0}
.today li:first-child{border-top:0}
.today li .when{font-family:var(--cs-mono);font-size:10.5px;color:var(--cs-faint);white-space:nowrap;padding-top:2px}
.today li.new{animation:slidein .55s ease-out}
.today li button.lnk{color:var(--cs-teal);text-decoration:underline;text-underline-offset:2px;font-size:12.5px;padding:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--cs-line);border:1px solid var(--cs-line)}
.tile{background:var(--cs-cream);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.tile:hover{background:#efe9dd}
.tile .n{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .m{font-family:var(--cs-mono);font-size:11px;color:var(--cs-muted);display:flex;justify-content:space-between;gap:6px}
.hbar{height:4px;background:rgba(22,33,31,.08);position:relative;border-radius:1px;overflow:hidden}
.hbar i{position:absolute;left:0;top:0;bottom:0;background:var(--cs-teal);transition:width .8s ease-out}
.hbar i.bad{background:var(--cs-claret)} .hbar i.mid{background:var(--cs-pale)}
.ask{display:flex;gap:8px;align-items:center;border:1px solid var(--cs-line2);border-radius:4px;padding:9px 12px;background:#fbf8f2;color:var(--cs-faint);font-size:13px;width:100%;text-align:left}
.connected{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:18px;padding:12px 16px}
.stages{display:flex;flex-direction:column;gap:0}
.stage{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--cs-line);font-size:13px;align-items:start;color:var(--cs-faint)}
.stage:first-child{border-top:0}
.stage .ic{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(22,33,31,.3);margin-top:1px;display:grid;place-items:center}
.stage.run{color:var(--cs-ink)} .stage.run .ic{border-color:var(--cs-gold);border-top-color:transparent;animation:spin .9s linear infinite}
.stage.done{color:var(--cs-ink)} .stage.done .ic{border-color:var(--cs-teal);background:var(--cs-teal)}
.stage.done .ic::after{content:"";width:6px;height:3px;border-left:1.5px solid var(--cs-cream);border-bottom:1.5px solid var(--cs-cream);transform:rotate(-45deg) translate(1px,-1px)}
.stage .meta{font-family:var(--cs-mono);font-size:10.5px;color:var(--cs-faint);white-space:nowrap;text-align:right}
.stage small{display:block;color:var(--cs-muted);font-size:12px;margin-top:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.decision{border-top:4px solid var(--cs-claret)}
.decision .opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.decision .opts button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--cs-line2);border-radius:4px;padding:10px 12px;background:#fbf8f2;font-size:13px}
.decision .opts button:hover{border-color:var(--cs-ink)}
.decision .opts button.rec{border-color:var(--cs-gold)}

/* knowledge */
.kstats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--cs-line);background:var(--cs-cream);border-radius:4px}
.kstats>div{padding:12px 14px;border-right:1px solid var(--cs-line)}
.kstats>div:last-child{border-right:0}
.kstats .v{font-family:var(--cs-mono);font-size:21px;margin-top:4px;font-variant-numeric:tabular-nums}
.kgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;margin-top:18px}
.graphbox{position:relative;padding:0;overflow:hidden}
.graphbox .bar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--cs-line);flex-wrap:wrap}
.graphbox input{flex:1;min-width:140px;border:1px solid var(--cs-line2);border-radius:3px;padding:6px 9px;font:13px var(--cs-sans);background:#fbf8f2;color:var(--cs-ink)}
#graph svg{display:block;width:100%;height:auto}
.gnode{cursor:pointer}
.gnode text{font:11px var(--cs-sans);fill:var(--cs-ink);paint-order:stroke;stroke:var(--cs-cream);stroke-width:3px}
.gnode.dim{opacity:.18}
.gedge{stroke:rgba(22,33,31,.28);stroke-width:1}
.gedge.dim{opacity:.12}
.gedge.hot{stroke:var(--cs-gold);stroke-width:1.6}
.gnode.new circle.ring{animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{r:10;opacity:.9}100%{r:26;opacity:0}}
.gnode.new circle.ring{animation-iteration-count:6}
.gnode.sel circle.c{stroke:var(--cs-gold);stroke-width:3}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--cs-line);font-family:var(--cs-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--cs-muted)}
.legend span{display:flex;align-items:center;gap:5px}
.ent .facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;margin:10px 0}
.ent .facts dt{font-family:var(--cs-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--cs-faint);padding-top:2px}
.ent .facts dd{margin:0}
.src{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--cs-line);font-size:12.5px}
.src .p{font-family:var(--cs-mono);font-size:10px;color:var(--cs-faint);display:block;margin-top:2px;letter-spacing:.3px}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:18px;border:1px solid var(--cs-line);border-radius:4px;background:var(--cs-cream)}
.pipe>div{padding:12px 14px;border-right:1px solid var(--cs-line);position:relative;font-size:12.5px;line-height:1.4}
.pipe>div:last-child{border-right:0}
.pipe .k{font-family:var(--cs-mono);font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--cs-teal);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.pipe .ms{font-family:var(--cs-mono);font-size:10px;color:var(--cs-faint);margin-top:6px}
.pipe>div.run{background:var(--cs-pale-t)}
.pipe>div.done .k::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cs-teal)}
.pipe>div.run .k::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cs-gold);animation:blink 0.8s steps(1) infinite}
.changed{border-top:4px solid var(--cs-gold)}
.changed ul{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.55}

/* library list */
.lib{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.lib th{text-align:left;font-weight:600;font-size:12.5px;color:var(--ms-text2);padding:9px 10px;border-bottom:1px solid var(--ms-border);white-space:nowrap}
.lib td{padding:10px 10px;border-bottom:1px solid #f0f0f0;white-space:nowrap}
.lib tr:hover td{background:#f8f8f8}
.lib tr.new td{animation:flash 2.6s ease-out}
.lib .fn{display:flex;align-items:center;gap:10px}
.fi{width:20px;height:24px;border-radius:2px;flex:none;position:relative}
.fi.pdf{background:#d13438}.fi.docx{background:#185abd}.fi.xlsx{background:#107c41}.fi.folder{background:#ffb900;height:16px;width:22px;border-radius:2px}
.fi.zip{background:#8a8886}
.crumb{font-size:18px;font-weight:600;margin:0 0 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb span{color:var(--ms-text2);font-weight:400}
.ka{font-size:11px;color:var(--ms-text2);display:inline-flex;gap:4px;align-items:center}
.progressbar{height:3px;background:#e0e0e0;overflow:hidden;position:relative}
.progressbar i{position:absolute;top:0;bottom:0;left:-40%;width:40%;background:var(--sp);animation:indet 1.1s ease-in-out infinite}
@keyframes indet{to{left:100%}}

/* ---------- Excel ---------- */
.xl{height:100%;display:flex;flex-direction:column;min-height:0;background:#fff}
.xl-ribbon{background:#f3f3f3;border-bottom:1px solid var(--ms-border)}
.xl-tabs{display:flex;gap:2px;padding:4px 10px 0;font-size:13px;overflow-x:auto}
.xl-tabs span{padding:6px 10px;white-space:nowrap}
.xl-tabs span.on{border-bottom:2px solid var(--xl);font-weight:600;color:var(--xl-d)}
.xl-tools{display:flex;gap:16px;padding:8px 14px;font-size:12px;color:var(--ms-text2);align-items:center;flex-wrap:wrap;background:#fff;border-top:1px solid var(--ms-border)}
.xl-tools .t{display:flex;align-items:center;gap:6px}
.xl-tools .sep{width:1px;height:20px;background:var(--ms-border)}
.xl-fbar{display:flex;align-items:center;border-bottom:1px solid var(--ms-border);font-size:13px;height:30px}
.xl-fbar .nm{width:90px;border-right:1px solid var(--ms-border);padding:0 8px;height:100%;display:flex;align-items:center}
.xl-fbar .fx{padding:0 10px;color:var(--ms-text3);font-style:italic;font-family:Cambria,Georgia,serif}
.xl-fbar .val{padding:0 8px;font-family:Consolas,'Cascadia Mono',var(--cs-mono);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xl-grid{flex:1;overflow:auto;min-height:0}
.xl-grid table{border-collapse:collapse;font-size:12.5px;font-family:Calibri,'Segoe UI',Arial,sans-serif}
.xl-grid th{background:#f3f3f3;color:#444;font-weight:400;border:1px solid #dadada;padding:3px 6px;position:sticky;top:0;z-index:2;min-width:40px}
.xl-grid th.rn{position:sticky;left:0;z-index:3;width:40px}
.xl-grid td.rn{background:#f3f3f3;color:#444;text-align:center;border:1px solid #dadada;position:sticky;left:0;z-index:1}
.xl-grid td{border:1px solid #e6e6e6;padding:4px 8px;white-space:nowrap;height:24px}
.xl-grid td.sel{outline:2px solid var(--xl);outline-offset:-2px}
.xl-grid td.r{text-align:right;font-variant-numeric:tabular-nums}
.xl-grid tr.title td{font-family:var(--cs-serif);font-size:20px;font-weight:600;border-color:transparent;height:34px;color:var(--cs-ink)}
.xl-grid tr.sub td{font-family:var(--cs-mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--cs-faint);border-color:transparent}
.xl-grid tr.hdr td{background:var(--cs-ink);color:var(--cs-cream);font-family:var(--cs-mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;border-color:#2c3734}
.xl-grid td.v-ok{background:rgba(28,74,69,.12);color:var(--cs-teal)}
.xl-grid td.v-mid{background:rgba(233,197,131,.45);color:#5a4418}
.xl-grid td.v-bad{background:rgba(92,43,46,.14);color:var(--cs-claret)}
.xl-grid td.v-idle{color:var(--ms-text3)}
.xl-grid td.neg{color:var(--cs-claret);font-weight:600}
.xl-sheets{display:flex;gap:0;border-top:1px solid var(--ms-border);background:#f3f3f3;font-size:12.5px;overflow-x:auto}
.xl-sheets span{padding:6px 16px;border-right:1px solid var(--ms-border);white-space:nowrap}
.xl-sheets span.on{background:#fff;color:var(--xl-d);font-weight:600;border-bottom:2px solid var(--xl)}
.xl-status{display:flex;justify-content:space-between;background:var(--xl);color:#fff;font-size:11.5px;padding:3px 12px}

/* ---------- Copilot ---------- */
.cop{height:100%;display:grid;grid-template-columns:250px 1fr;min-height:0;background:#fafafa}
.cop-left{border-right:1px solid var(--ms-border);padding:14px 10px;overflow:auto;background:#f5f5f5}
.cop-left .grp{font-size:12px;color:var(--ms-text2);font-weight:600;padding:12px 8px 6px}
.cop-left button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;padding:8px;border-radius:6px;font-size:13.5px}
.cop-left button.on{background:#fff;box-shadow:var(--shadow);font-weight:600}
.cop-left button:hover{background:#ececec}
.agico{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;flex:none}
.cop-main{display:flex;flex-direction:column;min-height:0;min-width:0}
.cop-scroll{flex:1;overflow:auto;padding:22px 28px 10px}
.cop-inner{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.agent-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 0 6px}
.agent-hero .big{width:56px;height:56px;border-radius:12px;background:var(--cs-ink);display:grid;place-items:center}
.agent-hero h2{margin:4px 0 0;font-size:20px;font-weight:600}
.agent-hero p{margin:0;color:var(--ms-text2);font-size:13.5px;max-width:560px;line-height:1.5}
.sugg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sugg button{text-align:left;background:#fff;border:1px solid var(--ms-border);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.4}
.sugg button:hover{border-color:var(--cop);background:var(--cop-l)}
.umsg{align-self:flex-end;background:var(--cop-l);border-radius:10px 10px 2px 10px;padding:10px 14px;max-width:80%;font-size:14px;line-height:1.5}
.amsg{display:flex;gap:12px;align-items:flex-start}
.amsg .bodyc{flex:1;min-width:0;background:#fff;border:1px solid var(--ms-border);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.6}
.amsg .bodyc p{margin:0 0 10px}
.amsg .bodyc .cs-in{font-family:var(--cs-sans)}
sup.ct{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:4px;background:var(--cop-l);color:var(--cop);font-size:10.5px;font-weight:600;vertical-align:2px;margin-left:2px;cursor:pointer}
.refs{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid #eee}
.refs .ref{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:6px 8px;border:1px solid #eee;border-radius:6px;background:#fafafa}
.refs .ref .pth{color:var(--ms-text3);font-size:11.5px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.refs .ref .k{min-width:18px;height:18px;border-radius:4px;background:var(--cop-l);color:var(--cop);font-size:10.5px;font-weight:600;display:grid;place-items:center}
.thinking{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ms-text2)}
.thinking div{display:flex;gap:8px;align-items:center}
.thinking .sp{width:12px;height:12px;border-radius:50%;border:2px solid var(--cop);border-top-color:transparent;animation:spin .8s linear infinite}
.thinking .ck{width:12px;height:12px;border-radius:50%;background:var(--cop)}
.ground{font-size:11.5px;color:var(--ms-text3);margin-top:8px}
.cop-input{padding:10px 28px 18px}
.cop-input .box{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--ms-border2);border-radius:10px;display:flex;align-items:center;gap:10px;padding:10px 12px;box-shadow:var(--shadow)}
.cop-input input{flex:1;border:0;outline:0;font:14px var(--ms-font);background:transparent;color:var(--ms-text);min-width:0}
.cop-input .send{width:32px;height:32px;border-radius:6px;background:var(--cop);color:#fff;display:grid;place-items:center}
.cop-input .note{max-width:820px;margin:6px auto 0;font-size:11px;color:var(--ms-text3);text-align:center}

/* ---------- tour, toasts, modal ---------- */
.tour{position:fixed;right:24px;bottom:24px;width:340px;max-width:calc(100% - 32px);background:var(--cs-cream);color:var(--cs-ink);border:1px solid var(--cs-line2);border-top:4px solid var(--cs-gold);border-radius:4px;box-shadow:0 12px 32px rgba(22,33,31,.22);z-index:50;font-family:var(--cs-sans)}
.tour .th{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 0}
.tour .tb{padding:6px 14px 12px}
.tour h3{font-family:var(--cs-serif);font-size:23px;font-weight:600;letter-spacing:-.3px;margin:2px 0 6px;line-height:1.1}
.tour p{margin:0;font-size:13px;line-height:1.5;color:var(--cs-muted)}
.tour .piece{margin-top:9px;padding-top:8px;border-top:1px solid var(--cs-line);font-size:12px;color:var(--cs-ink);display:flex;gap:8px}
.tour .piece b{font-family:var(--cs-mono);font-weight:500;font-size:10px;letter-spacing:1.1px;color:var(--cs-teal);text-transform:uppercase;white-space:nowrap;padding-top:1px}
.tour .tf{display:flex;align-items:center;gap:8px;padding:10px 14px 12px;border-top:1px solid var(--cs-line)}
.tour .steps{display:flex;gap:3px;flex:1;min-width:96px}
.tour .steps button{flex:1;height:5px;background:rgba(22,33,31,.14);border-radius:1px;padding:0}
.tour .steps button.done{background:var(--cs-teal)} .tour .steps button.on{background:var(--cs-gold)}
.tour .x{font-family:var(--cs-mono);font-size:11px;color:var(--cs-faint);padding:4px}
.tour.min .tb,.tour.min .tf .steps{display:none}
.toasts{position:fixed;top:64px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:60;pointer-events:none;width:360px;max-width:calc(100% - 32px)}
.toast{background:#fff;border-radius:8px;box-shadow:var(--shadow2);padding:12px 14px;display:flex;gap:12px;animation:toastin .4s ease-out;font-size:13px;line-height:1.4;pointer-events:auto}
.toast.out{animation:toastout .35s ease-in forwards}
.toast .ti{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.toast .tt{font-size:11.5px;color:var(--ms-text2)}
.toast b{display:block;font-size:13.5px}
@keyframes toastin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateX(30px)}}
.modal{position:fixed;inset:0;background:rgba(22,33,31,.45);z-index:80;display:grid;place-items:center;padding:16px}
.modal .mbox{width:min(1040px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--cs-cream);border-top:4px solid var(--cs-gold);border-radius:4px;padding:26px 28px;font-family:var(--cs-sans);color:var(--cs-ink)}
.modal h2{font-size:32px;margin:6px 0 6px}
.modal .lede{font-size:14px;color:var(--cs-muted);max-width:760px;line-height:1.55;margin:0 0 16px}
.modal .closex{float:right}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--cs-line);margin:8px 0 22px}
.flow>div{padding:12px 14px;border-right:1px solid var(--cs-line);font-size:12.5px;line-height:1.45}
.flow>div:last-child{border-right:0}
.flow .k{font-family:var(--cs-mono);font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--cs-teal);margin-bottom:6px}
.tblwrap{overflow-x:auto}
.st-ga{color:var(--cs-teal)} .st-pv{color:#6b521f} .st-cs{color:var(--cs-ink)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .cc-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cc-grid .cc-col:last-child{grid-column:1/-1}
  .kstats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kstats>div:nth-child(3){border-right:0}
  .kstats>div:nth-child(-n+3){border-bottom:1px solid var(--cs-line)}
  .ol{grid-template-columns:0 300px 1fr}
  .ol-folders{display:none}
}
@media (max-width:900px){
  .kgrid,.cc-grid{grid-template-columns:minmax(0,1fr)}
  .teams{grid-template-columns:0 1fr} .t-left{display:none}
  .ol{grid-template-columns:minmax(0,1fr)} .ol-list{display:none} .ol.showlist .ol-list{display:block} .ol.showlist .ol-read{display:none}
  .cop{grid-template-columns:minmax(0,1fr)} .cop-left{display:none}
  .pipe,.flow{grid-template-columns:minmax(0,1fr)} .pipe>div,.flow>div{border-right:0;border-bottom:1px solid var(--cs-line)}
  .suite .search{display:none}
}
@media (max-width:700px){
  #demo{padding:0 0 0}
  .win{border-radius:0}
  .wbody{grid-template-columns:minmax(0,1fr);grid-template-rows:1fr auto}
  .rail{flex-direction:row;justify-content:space-around;order:2;border-right:0;border-top:1px solid var(--ms-border);padding:2px 0}
  .rail button{width:auto;flex:1;height:52px}
  .rail button.on::before{left:30%;right:30%;top:auto;bottom:2px;width:auto;height:3px}
  .demobar{padding:8px 16px;gap:8px}
  .demobar .tag.hide-s{display:none}
  .sp-head{padding:12px 16px 0} .sp-body{padding:16px 16px 140px} .sp-site .r{display:none}
  .jobs{grid-template-columns:repeat(2,minmax(0,1fr))} .jobs>*:nth-child(2n){border-right:0} .jobs>*:nth-child(-n+4){border-bottom:1px solid var(--cs-line)}
  .cc-hero h1{font-size:27px}
  .sugg{grid-template-columns:minmax(0,1fr)}
  .tour{right:8px;left:8px;bottom:62px;width:auto;max-width:none}
  .toasts{right:8px;top:56px}
  .suite .right .org{display:none}
  .t-posts{padding:14px 12px} .post .pb,.post .replies,.post .replyln{padding-left:16px}
  .acard .facts{grid-template-columns:minmax(0,1fr)}
  .ol-read{padding:12px} .mail .mb,.mail .att,.mail .acts{margin-left:0}
  .cop-scroll{padding:16px 12px} .cop-input{padding:8px 12px 12px}
  .modal .mbox{padding:20px 16px}
}

.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--cs-teal)} .sw.on i{left:20px}
.sw.lk{opacity:.75;cursor:default}

function tileHtml(b){
  let ver = b.ver, per = b.period, note = b.note;
  if (b.id==='juniper' && S.f.replied){ ver = 3.88; per = 'Aug-26'; note = 'Leverage 3.9x verified, 3.4x reported'; }
  if (b.id==='juniper' && S.f.pkg && !S.f.replied){ note = 'August package in review'; }
  if (b.id==='saffron' && S.f.saffronAlert){ note = 'Incremental would breach 4.0x on revised QoE'; }
  const st = statusOf(b);
  let metric = '—', w = 0;
  if (ver!=null){
    metric = b.metric.startsWith('Minimum') ? `$${ver.toFixed(1)}m / ≥$${b.limit.toFixed(1)}m` : b.min ? `${ver.toFixed(2)}x / ≥${b.limit.toFixed(2)}x` : `${ver.toFixed(1)}x / ≤${b.limit.toFixed(1)}x`;
    const head = b.min ? (ver-b.limit)/b.limit : (b.limit-ver)/b.limit;
    w = Math.max(3, Math.min(100, head/0.45*100));
  } else metric = b.st==='dd' ? 'Diligence File · day 6' : 'Connecting systems';
  return `<button type="button" class="tile" data-tile="${b.id}" title="${note}"><span class="n"><span class="dot ${st}"></span>${b.name}<span class="cs-faint mono" style="font-weight:400;font-size:10px;margin-left:auto">${b.prod.toUpperCase()}</span></span>
    <span class="m"><span>${metric}</span><span>${per}</span></span>
    <span class="hbar"><i class="${st==='bad'?'bad':st==='mid'?'mid':''}" style="width:${w}%"></i></span>
    <span style="font-size:11.5px;color:var(--cs-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${note}</span></button>`;
}

function levChart(){
  const W=520,H=210,L=44,R=112,T=22,B=30, mo=['Mar','Apr','May','Jun','Jul','Aug'];

  const n = S.jStage>=4 ? 6 : 5;

  const path=a=>a.slice(0,n).map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Juniper total leverage, reported versus verified">
    ${[3.0,3.5,4.0].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(22,33,31,.10)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="10" fill="rgba(22,33,31,.55)">${v.toFixed(1)}X</text>`).join('')}

    ${mo.map((m,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10" fill="rgba(22,33,31,.55)">${m.toUpperCase()}</text>`).join('')}
    <path d="${path(rep)}" fill="none" stroke="rgba(22,33,31,.55)" stroke-width="1.8"/>
    <path d="${path(ver)}" fill="none" stroke="#A98543" stroke-width="2.4"/>
    ${ver.slice(0,n).map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#A98543"><title>Verified ${mo[i]}-26: ${v.toFixed(2)}x</title></circle>`).join('')}
    <text x="${x(n-1)+8}" y="${y(ver[n-1])-6}" font-family="IBM Plex Mono,monospace" font-size="11" fill="#16211F">${ver[n-1].toFixed(n===6?2:1)}X VERIFIED</text>

  </svg>`;
}

  renderSuite(); renderRail();
  const v = $('#view');
  v.innerHTML = ({teams:renderTeams, outlook:renderOutlook, sharepoint:renderSP, excel:renderExcel, copilot:renderCopilot})[S.app]();
  if (key !== lastNav){ v.firstElementChild?.classList.add('fadein'); }
  else Object.entries(keep).forEach(([id,t]) => { const e = document.getElementById(id); if (e) e.scrollTop = t; });
  lastNav = key;
  // count-ups
  document.querySelectorAll('[data-from]').forEach(el => { const a=+el.dataset.from, b=+el.dataset.to, t0=performance.now();
    const tick = t => { const p=Math.min(1,(t-t0)/1000), e=1-Math.pow(1-p,3); el.textContent = Math.round(a+(b-a)*e).toLocaleString('en-US'); if(p<1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); });
  S.kCount = false;
  if (S.app==='teams'){ const p = $('#keep-teams'); if (p) p.scrollTop = p.scrollHeight; }
  if (S.app==='copilot'){ const p = $('#keep-cop'); const u = [...document.querySelectorAll('.umsg')].pop(); if (p) p.scrollTop = u ? Math.max(0, u.offsetTop - p.offsetTop - 16) : 0; }

async function askAnimated(key, typed){
  if (S.cop.some(m=>m.pending)) return;
  const q = typed || QUESTIONS[key];
  if (S.app!=='copilot'){ S.app='copilot'; render(); await sleep(400); }
  if (!typed){
    const inp = $('#copIn');
    await typeText(t => { S.copDraft = t; const e = $('#copIn'); if (e) e.value = t; }, q, 55);
    await sleep(300);
  }
  S.copDraft = '';
  S.cop.push({role:'u', text:q});
  const m = {role:'a', key, pending:true, done:0};
  S.cop.push(m); render();
  const n = answer(key).think.length;
  for (let i=0;i<n;i++){ await sleep(850); m.done = i+1; if (S.app==='copilot') render(); }
  await sleep(350);
  m.pending = false; if (S.app==='copilot') render();
}
function askFree(key){
  // free question outside the tour: don't cancel the tour, just answer

}

   body:'Code recomputes each figure from Juniper\'s QuickBooks, ServiceTitan, Stripe and bank records on the credit agreement\'s definitions, and an analyst signs off. The reply lands in the same Outlook thread: leverage is 3.9x, not 3.4x.',
   piece:'CreditSwan service on Azure; reply from the shared mailbox; Teams post through Workflows',
   nav(){ S.app='sharepoint'; S.sp='juniper'; },
   apply(){ S.jStage = 6; S.jRunning = false; S.f.replied = true; S.f.juniperAlert = true; },
   async play(){ S.jRunning = true; render();
     for (let i=S.jStage;i<6;i++){ await sleep(i===2?1500:1000); S.jStage = i+1; if (i===3) S.clock='10:09'; if (i===5) S.clock='10:12'; renderSuite(); render(); }
     S.jRunning = false; S.f.replied = true; render(); toast('outlook','CreditSwan Review Desk','RE: Juniper · two of five figures supported'); await sleep(1500);
     S.f.juniperAlert = true; S.teamsUnread++; render(); toast('teams','CreditSwan posted in Exceptions','Juniper: leverage 3.9x verified against 4.0x'); }},
  {title:'The covenant workbook updates itself', clock:'10:12',
   body:'The team\'s Excel workbook now holds the verified figure beside the reported one, with headroom and a verdict. The Saffron pro forma test from this morning is already there.',
   piece:'Excel workbook in SharePoint, written through the Microsoft Graph Excel API',
   nav(){ S.app='excel'; S.xlSel='E5'; },
   apply(){ S.f.xl = true; },
   async play(){ await sleep(900); S.f.xl = true; S.xlFlash = true; S.xlSel = 'E5'; render(); await sleep(1500); S.xlSel='F5'; render(); await sleep(1500); S.xlFlash=false; }},
  {title:'Choose the model for each job', clock:'10:20',
   body:'Administrators pick the model for every job, with CreditSwan\'s recommendation and the monthly cost at your volume. Figures are locked to code. Claude runs in your Microsoft Foundry, beside the other models in your catalogue.',
   piece:'Microsoft Foundry deployments in your Azure subscription',
   nav(){ S.app='sharepoint'; S.sp='config'; S.cfg=Object.fromEntries(USES.map(u=>[u.id,u.rec])); S.cfgHot=null; },
   apply(){ S.cfgHot=null; },
   async play(){ await sleep(1400); S.cfgHot='qa'; render(); await sleep(900); S.cfg.qa='opus'; S.cfgFlash=true; render(); await sleep(1600); S.cfgFlash=false; S.cfgHot='thesis'; render(); await sleep(1300);
     S.cfg.qa='sonnet'; S.cfgHot=null; S.cfgFlash=true; render(); toast('cs','Recommended mix applied','Deal Knowledge answers back on Claude Sonnet 5.5'); await sleep(900); S.cfgFlash=false; }},
  {title:'One decision, with its evidence', clock:'10:24',
   body:'The command center now shows what changed, what is at risk and what needs a decision, ordered by deadline and dollars. CreditSwan prepares the evidence and a draft; you decide.',
   piece:'All of it inside Microsoft 365: SharePoint, Outlook, Excel, Teams and Copilot',
   nav(){ S.app='sharepoint'; S.sp='home'; },
   apply(){},
   async play(){ S.flashDecision = true; render(); await sleep(600); const d = $('#decision'), c = $('#keep-sp'); if (d && c){ c.scrollTo({top: Math.max(0, d.offsetTop - 140), behavior:'smooth'}); d.classList.add('pulse'); } await sleep(2000); S.flashDecision=false; }},
];
const PKG_STEP = STEPS.findIndex(s=>s.title==='The monthly package arrives');
async function runThesis(){
  if (S.thRunning) return;
  S.thRunning = true; S.thStage = 0; render();
  for (let i=0;i<TH_STAGES.length;i++){ await sleep(i===5?1300:850); S.thStage = i+1; if (S.app==='sharepoint'&&S.sp==='thesis') render(); }
  await sleep(300); S.thRunning = false; render();
  const c = $('#keep-sp'); if (c) c.scrollTo({top:0, behavior:'smooth'});
}
async function forwardFlow(){
  if (S.f.fwd) return;
  S.composer = {title:'Forward', to:'', subject:'FW: Juniper · August 2026 monthly package', body:'', send:'sendfwd'}; render();
  await sleep(500);
  await typeText(t => { S.composer.to = t; const e=$('#cmpTo'); if (e) e.innerHTML = `<span class="caret">${t}</span>`; }, 'creditswan-intake@'+FIRM.domain, 40);
  render(); await sleep(300);
  await typeText(t => { S.composer.body = t; const e=$('#cmpBody'); if (e) e.textContent = t; }, 'For checking.', 22);
  await sleep(700);
  sendForward();
}
function sendForward(){
  S.composer = null; S.f.fwd = true; S.jStage = Math.max(S.jStage,1); render();
  toast('cs','Package received','Juniper Aug-26 · 5 reported figures read · check started');
}

function resetState(){
  const keep = {auto:S.auto, tourMin:S.tourMin};
  S = Object.assign(INIT(), keep);
}
async function goStep(i){
  RUN++;
  i = Math.max(0, Math.min(STEPS.length-1, i));
  resetState();
  for (let j=1;j<i;j++){ STEPS[j].apply(); S.clock = STEPS[j].clock; }
  S.step = i; S.clock = STEPS[i].clock;
  // unread state after instant replay
  if (S.f.pkg){ S.olUnreadJ = !S.f.fwd; }
  if (S.f.saffronAlert || S.f.juniperAlert) S.teamsUnread = (S.f.saffronAlert?1:0)+(S.f.juniperAlert?1:0);
  S.olUnread = (S.olUnreadA?1:0)+(S.olUnreadJ?1:0);
  STEPS[i].nav();
  if (S.app==='teams' && S.ch==='exceptions') S.teamsUnread = 0;
  if (S.app==='outlook' && S.olSel==='juniper') { S.olUnreadJ=false; S.olUnread=S.olUnreadA?1:0; }
  render();
  const r = RUN;
  try {
    await STEPS[i].play();
    STEPS[i].apply(); if (r===RUN) render();
    if (S.auto && i < STEPS.length-1){ await sleep(4200); goStep(i+1); }
    else if (S.auto){ S.auto=false; renderTour(); }
  } catch(e){ /* cancelled by a newer jump */ }
}
function renderTour(){
  const t = $('#tour'); const s = STEPS[S.step]; const last = S.step===STEPS.length-1;
  t.className = 'tour' + (S.tourMin?' min':'');
  t.innerHTML = `<div class="th"><span class="cs-label">Guided tour · step ${S.step+1} of ${STEPS.length}</span><span style="display:flex;gap:4px"><button type="button" class="x" data-t="min" aria-label="${S.tourMin?'Expand':'Minimise'} the tour">${S.tourMin?'EXPAND':'HIDE'}</button></span></div>
    <div class="tb"><h3>${s.title}</h3><p>${s.body}</p><div class="piece"><b>Microsoft piece</b><span>${s.piece}</span></div></div>
    <div class="tf"><div class="steps">${STEPS.map((_,i)=>`<button type="button" data-t="step" data-i="${i}" class="${i<S.step?'done':i===S.step?'on':''}" aria-label="Step ${i+1}: ${STEPS[i].title}"></button>`).join('')}</div>
    <button type="button" class="btn" data-t="back" ${S.step===0?'disabled style="opacity:.4"':''}>Back</button>
    <button type="button" class="btn" data-t="auto">${S.auto?'Pause':'Play'}</button>
    <button type="button" class="btn pri" data-t="${last?'built':'next'}">${last?'How it is built':'Next'}</button></div>`;
}

// ---------- how it is built ----------
function renderBuilt(){
  const rows = [
    ['Spot a deal-room change','Microsoft Graph change notifications on every deal-room library, then a delta query for what changed'],
    ['Store the knowledge graph','Graph in Microsoft Fabric on OneLake, queried with GQL, over 2,184 deal rooms and 3,960 memos'],
    ['Answer questions with citations','Deal Knowledge agent built in Copilot Studio, used in Microsoft 365 Copilot and SharePoint'],
    ['Tag deal-room files automatically','Knowledge Agent in SharePoint fills document type, borrower and period columns'],
    ['Make findings searchable in Copilot','Microsoft 365 Copilot connectors publish CreditSwan findings and readings'],
    ['Pipeline and Diligence Files','Deal rooms as SharePoint sites; Diligence Files stored there as PDF, workbook and page'],
    ['Thesis studio','Deal graph plus public series and your licensed panels, read inside your tenant'],
    ['Model routing','Microsoft Foundry deployments in your Azure subscription: Claude and the rest of your catalogue'],
    ['Intake mailbox','Exchange Online shared mailbox, read and answered through Microsoft Graph'],
    ['Covenant workbook','Excel on the SharePoint site, written through the Microsoft Graph Excel API'],
    ['Alerts on exceptions only','Teams channel posts through Workflows'],
    ['Limit CreditSwan\'s access','Microsoft Graph Sites.Selected: only the sites your administrator names'],
    ['Recompute figures from borrower records','CreditSwan service on Azure; QuickBooks, Xero, NetSuite, ServiceTitan, Square, Stripe and bank feeds, read-only'],
  ];
  $('#built').innerHTML = `<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="builtH"><button type="button" class="btn closex" data-t="closebuilt">Close</button>
    <div class="cs-label">How it is built · Microsoft parts and CreditSwan parts</div>
    <h2 class="cs-h" id="builtH">Microsoft provides the parts. CreditSwan assembles, runs and verifies them.</h2>
    <p class="lede">Every surface is a Microsoft 365 product the firm already pays for. CreditSwan configures the graph, the agent and the models, and adds what Microsoft does not have: Diligence Files and a check of each reported figure against the borrower's own records.</p>
    <div class="cs-label" style="margin-top:6px">Deal knowledge, refreshed on every change</div>
    <div class="flow"><div><div class="k">01 · Detect</div>A file is added or edited in a deal room. Graph sends a change notification within a minute.</div><div><div class="k">02 · Read</div>A delta query returns only the changed files. Text and tables are extracted.</div><div><div class="k">03 · Link</div>Deals, figures, add-backs and parties are joined to 28 years of deal rooms and memos.</div><div><div class="k">04 · Use</div>Copilot, the pipeline and the thesis studio cite the new file. Exceptions, and only exceptions, post to Teams.</div></div>
    <div class="cs-label">Verified figures</div>
    <div class="flow"><div><div class="k">01 · Source</div>Deal-room files for a Diligence File; the borrower's own systems for monitoring.</div><div><div class="k">02 · Compute</div>Code computes every figure on the agreement's or the study's definitions.</div><div><div class="k">03 · Sign off</div>A CreditSwan analyst reviews every difference against source rows.</div><div><div class="k">04 · Deliver</div>Reply in the same thread, evidence in SharePoint, workbook updated, Teams on exceptions.</div></div>
    <div class="tblwrap"><table class="cst"><tr><th>Job</th><th>What runs it</th><th>Status</th></tr>
    ${rows.map(r=>`<tr><td><b style="font-weight:600">${r[0]}</b></td><td>${r[1]}</td><td style="white-space:nowrap"><span class="dot ok" style="margin-right:6px"></span><span class="st-ga">Running</span></td></tr>`).join('')}</table></div>
    <p class="cs-faint" style="font-size:12px;line-height:1.5;margin:14px 0 0">Simulated demo with synthetic borrowers, deals and people; the auto care Diligence File is an anonymized engagement.</p></div>`;
  $('#built').hidden = false;
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-t],[data-app],[data-sp],[data-go],[data-ol],[data-ch],[data-kg],[data-ask],[data-act],[data-tile],[data-cell],[data-pdeal],[data-pclose],[data-psec],[data-pview],[data-dd],[data-ddtab],[data-rd],[data-trace],[data-est],[data-escope],[data-thesis],[data-th],[data-kgset],[data-cfg],[data-cfgrec],[data-scope],[data-lic]');
  if (!t) { if (e.target.id==='built') $('#built').hidden = true; return; }
  const d = t.dataset;
  if (d.t){
    if (d.t==='next'){ S.auto=false; goStep(S.step+1); }
    else if (d.t==='back'){ S.auto=false; goStep(S.step-1); }
    else if (d.t==='step'){ S.auto=false; goStep(+d.i); }
    else if (d.t==='auto'){ S.auto=!S.auto; if (S.auto) goStep(S.step===STEPS.length-1?0:S.step+1); else renderTour(); }
    else if (d.t==='min'){ S.tourMin=!S.tourMin; renderTour(); }
    else if (d.t==='built') renderBuilt();
    else if (d.t==='closebuilt') $('#built').hidden = true;
    return;
  }
  if (d.kgset!=null){ S.kgSet = d.kgset; S.kgSel = d.kgset==='auto' ? 'dA' : 'saffron'; S.kgQuery=''; if (!d.go){ render(); return; } }
  if (d.pdeal){ S.pSel = S.pSel===d.pdeal ? null : d.pdeal; render(); return; }
  if (d.pclose){ S.pSel = null; render(); return; }
  if (d.psec){ S.pSec = d.psec; render(); return; }
  if (d.pview){ S.pView = d.pview; render(); return; }
  if (d.dd){ S.ddTab = d.dd; S.trace = null; S.pSel = null; go('sharepoint','dd'); const c=$('#keep-sp'); if (c) c.scrollTo({top:0}); return; }
  if (d.ddtab){ S.ddTab = d.ddtab; S.trace = null; render(); return; }
  if (d.rd){ S.rdSel = d.rd; render(); return; }
  if (d.trace!=null){ S.trace = d.trace || null; render(); return; }
  if (d.est){ S.estSel = d.est; render(); return; }
  if (d.escope){ S.estScope = d.escope; if (d.escope==='cs' && !CONSUMER_SERVICES.includes(S.estSel)) S.estSel='auto'; render(); return; }
  if (d.thesis){ if (d.thesis!=='auto'){ toast('cs', SECT[d.thesis].l+' thesis', 'In this demo the auto care thesis is the one built out in full.'); } S.thSec='auto'; go('sharepoint','thesis'); return; }
  if (d.th){ runThesis().catch(()=>{ S.thRunning=false; render(); }); return; }
  if (d.cfg){ const [u,m] = d.cfg.split(':'); S.cfg[u] = m; S.cfgHot = u; S.cfgFlash = true; render(); setTimeout(()=>{ S.cfgFlash=false; }, 900); return; }
  if (d.cfgrec){ S.cfg = Object.fromEntries(USES.map(u=>[u.id,u.rec])); S.cfgFlash = true; render(); toast('cs','Recommended mix applied','Each job uses the model CreditSwan recommends'); return; }
  if (d.scope){ S.scope[+d.scope] = !S.scope[+d.scope]; render(); return; }
  if (d.lic){ S.lic[+d.lic] = !S.lic[+d.lic]; render(); return; }
  if (d.app){ go(d.app); return; }
  if (d.sp){ go('sharepoint', d.sp); return; }
  if (d.go){ const [a,s] = d.go.split(':'); go(a==='sp'?'sharepoint':a, s); return; }
  if (d.ol){ go('outlook', d.ol); return; }
  if (d.ch){ go('teams', d.ch); return; }
  if (d.kg){ S.kgSel = d.kg; const g=$('#graph'); if (g){ g.innerHTML = graphSvg(); $('#entity').innerHTML = entityPanel(); } return; }
  if (d.ask){ askFree(d.ask); return; }
  if (d.tile){ if (d.tile==='juniper') go('sharepoint','juniper'); else toast('cs', BORROWERS.find(b=>b.id===d.tile).name+' (synthetic)', 'In this demo the Juniper folder is the one built out in full.'); return; }
  if (d.cell){ S.xlSel = d.cell; render(); return; }
  if (d.act){
    const a = d.act;
    if (a.startsWith('sim:')) toast('cs', a.slice(4), 'Simulated in this demo');
    else if (a==='forward'){ if (S.step < PKG_STEP) goStep(PKG_STEP); else { RUN++; forwardFlow().catch(()=>{}); } }
    else if (a==='sendfwd'){ sendForward(); }
    else if (a==='discard'){ S.composer=null; render(); }
    else if (a==='draft'){ S.app='outlook'; S.olSel='juniper'; S.composer = {title:'Reply · draft prepared by CreditSwan', to:'Elena Marsh', subject:'RE: Juniper · August 2026 monthly package', send:'senddraft',
        body:'Hi Elena,\n\nThank you for the August package. Before we confirm compliance, please send support for two add-backs in covenant EBITDA: brand relaunch costs of $0.7m and projected synergies of $0.5m. Under §1.01, non-recurring costs are capped at 10% of EBITDA and synergies count only once realised. On that basis leverage is 3.9x.\n\nCould you also share the payer split behind the 18% HomeShield figure? Our records show 26% on a trailing basis.\n\nBest,\n'+ME.first}; render(); }
    else if (a==='senddraft'){ S.composer=null; render(); toast('cs','Not sent','This is a simulated demo. In a deployment the draft waits in your Drafts folder until you send it.'); }
  }
});
document.addEventListener('submit', e => {
  if (e.target.id==='copForm'){ e.preventDefault(); const v = $('#copIn').value.trim(); if (!v) return; S.copDraft='';
    const key = pickKey(v); const r = RUN; askAnimated(key, v).catch(()=>{ const m=S.cop.find(x=>x.pending); if(m) m.pending=false; render(); }); }
});
document.addEventListener('input', e => {
  if (e.target.id==='kgq'){ S.kgQuery = e.target.value; $('#graph').innerHTML = graphSvg(); }
  if (e.target.id==='copIn'){ S.copDraft = e.target.value; }
});
document.addEventListener('mouseover', e => {
  const g = e.target.closest('.gnode'); const svg = $('#graph svg'); if (!svg) return;
  svg.querySelectorAll('.gedge').forEach(l => { const [a,b] = l.dataset.e.split('|'); l.classList.toggle('hot', !!g && (a===g.dataset.kg||b===g.dataset.kg)); });
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape') $('#built').hidden = true;
  const g = e.target.closest && e.target.closest('.gnode'); if (g && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); g.dispatchEvent(new MouseEvent('click',{bubbles:true})); }
  if (e.target.tagName==='INPUT') return;
  if (e.key==='ArrowRight'){ S.auto=false; goStep(S.step+1); }
  if (e.key==='ArrowLeft'){ S.auto=false; goStep(S.step-1); }
});
$('#btnTour').onclick = () => { S.tourMin=false; S.auto=false; goStep(0); };
$('#btnBuilt').onclick = renderBuilt;
$('#btnReset').onclick = () => { S.auto=false; goStep(0); };
try { if (innerWidth < 700) S.tourMin = true; } catch(e){}
try { if (BRAND.accent){ APPS.sharepoint.c = BRAND.suite || BRAND.accent; document.documentElement.style.setProperty('--sp', BRAND.suite || BRAND.accent); } } catch(e){}
try { const tg = document.querySelectorAll('.demobar .tag'); tg[1].textContent = BRAND.synthFirm ? 'Synthetic lender, deals and borrowers' : 'Prepared for '+FIRM.full+' · synthetic deals and borrowers'; } catch(e){}
goStep(0);
</script>
